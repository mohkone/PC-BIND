name: Research integrity checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -File *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name): $($errors.Message -join '; ')"
            }
          }
          if ($failed) { exit 1 }

  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Data-free scientific regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Verify experiment launchers
        shell: pwsh
        run: .\tests\test_launchers.ps1
      - name: Transport forward and backward smoke test
        shell: pwsh
        run: |
          $env:PPI_PARTNER_LOGIT_MODE = "delta"
          $env:PPI_DISABLE_PLM = "1"
          .\.venv\Scripts\python.exe .\smoke_test_pcbind_ot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
